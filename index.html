<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Impulse Cameras — Vendor Channel</title>
<style>
  :root {
    --teal:#2F93AD; --ink:#FFFFFF; --panel:#000000; --panel2:#0E0E0E;
    --rail: 22vw;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{display:flex;height:100vh;width:100vw}

  /* video side */
  #videoWrap{flex:1;position:relative;background:#000;overflow:hidden}
  #playerBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #player{width:100%;height:100%;border:0}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        color:#666;font-size:1.1vw}

  /* rail */
  #rail{width:var(--rail);min-width:260px;background:var(--panel);color:var(--ink);
    display:flex;flex-direction:column;padding:1.6vw 1.4vw;gap:1.1vh;
    border-left:1px solid #1c1c1c;z-index:2}
  #logo{width:100%;max-width:100%;display:block}
  .rule{height:3px;background:var(--teal);border-radius:2px;opacity:.9}
  .eyebrow{font-size:.92vw;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:700}
  #vendorName{font-size:2.6vw;line-height:1.05;font-weight:800;letter-spacing:-.01em;margin:.1vh 0 0}

  .shop{display:flex;flex-direction:column;align-items:center;gap:.6vh;
    background:var(--panel2);border:1px solid #222;border-radius:.6vw;padding:1vh .8vw}
  .shop-qr{width:9.5vw;max-width:190px;aspect-ratio:1;background:transparent;padding:.35vw}
  .shop-qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .shop-cta{font-size:1.25vw;font-weight:700;text-align:center;line-height:1.25}
  .shop-sub{font-size:.9vw;color:var(--teal);text-align:center}

  #socials{display:grid;grid-template-columns:1fr 1fr;gap:.7vw}
  .soc{background:var(--panel2);border:1px solid #222;border-radius:.5vw;padding:.6vh .4vw;
        display:flex;flex-direction:column;align-items:center;gap:.35vh}
  .soc-qr{width:4.1vw;max-width:86px;aspect-ratio:1;background:transparent;padding:.2vw}
  .soc-qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .soc-meta{display:flex;align-items:center;gap:.25vw;max-width:100%}
  .soc-icon{width:1.15vw;height:1.15vw;min-width:13px;min-height:13px;fill:var(--teal);flex:none}
  .soc-handle{font-size:.74vw;color:#cfcfcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #hours{margin-top:auto;text-align:center;background:var(--panel2);border:1px solid #222;
    border-radius:.6vw;padding:1.1vh .6vw}
  #hours .hrs-val{font-size:1.5vw;font-weight:800;color:#fff;line-height:1.15;margin-top:.2vh}
  #hours .hrs-sub{font-size:.82vw;color:var(--teal);font-weight:600;letter-spacing:.04em}
  #foot{margin-top:.9vh;font-size:.86vw;color:#9a9c9a;line-height:1.45;text-align:center}
  #foot b{color:#FFFFFF}
</style>
</head>

      if (id && id === curId) return;   // already acted on this one

      skips++;

      return;

          e.target.mute();
          if (shuffle) { try { e.target.setShuffle(true); } catch(_){} }
          try { e.target.setLoop(true); } catch(_){}
          e.target.playVideo();
        },
        onError: function (e) {
          dead++;
          if (dead > 25) { location.reload(); return; }
          try { e.target.nextVideo(); } catch(_) { location.reload(); }
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) {
            try { e.target.playVideoAt(0); } catch(_) { location.reload(); }
          }
          if (e.data === YT.PlayerState.PLAYING) {
            dead = 0;
            // getDuration() is often still 0 the instant PLAYING fires, so
            // probe a few times before deciding.
            checkShort(e.target, 0);
          }
        }
      }
    });
  };

  setTimeout(function () {
    try { if (!player || player.getPlayerState() !== YT.PlayerState.PLAYING) location.reload(); }
    catch(_) { location.reload(); }
  }, 60000);

  if (reloadMins > 0) setTimeout(function(){ location.reload(); }, reloadMins*60000);

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
