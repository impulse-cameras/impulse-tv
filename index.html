<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Impulse Cameras — Vendor Channel</title>
<style>
  :root {
    --teal:#2F93AD; --ink:#2A2B2A; --panel:#FFFFFF; --panel2:#F4F4F4;
    --rail: 22vw;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{display:flex;height:100vh;width:100vw}

  /* video side */
  #videoWrap{flex:1;position:relative;background:#000;overflow:hidden}
  #playerBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #player{width:100%;height:100%;border:0}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        color:#555;font-size:1.1vw}

  /* rail */
  #rail{width:var(--rail);min-width:260px;background:var(--panel);color:var(--ink);
    display:flex;flex-direction:column;padding:1.6vw 1.4vw;gap:1.1vh;
    box-shadow:-6px 0 24px rgba(0,0,0,.45);z-index:2}
  #logo{width:100%;max-width:100%;display:block}
  .rule{height:3px;background:var(--teal);border-radius:2px;opacity:.9}
  .eyebrow{font-size:.72vw;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:700}
  #vendorName{font-size:2.1vw;line-height:1.05;font-weight:800;letter-spacing:-.01em;margin:.1vh 0 0}

  .shop{display:flex;flex-direction:column;align-items:center;gap:.6vh;
    background:var(--panel2);border-radius:.6vw;padding:1vh .8vw}
  .shop-qr{width:9.5vw;max-width:190px;aspect-ratio:1;background:#fff;padding:.35vw;border-radius:.35vw}
  .shop-qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .shop-cta{font-size:.95vw;font-weight:700;text-align:center;line-height:1.25}
  .shop-sub{font-size:.72vw;color:#6a6c6a;text-align:center}

  #socials{display:grid;grid-template-columns:1fr 1fr;gap:.7vw}
  .soc{background:var(--panel2);border-radius:.5vw;padding:.6vh .4vw;
        display:flex;flex-direction:column;align-items:center;gap:.35vh}
  .soc-qr{width:4.1vw;max-width:86px;aspect-ratio:1;background:#fff;padding:.2vw;border-radius:.25vw}
  .soc-qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .soc-meta{display:flex;align-items:center;gap:.25vw;max-width:100%}
  .soc-icon{width:.95vw;height:.95vw;min-width:11px;min-height:11px;fill:var(--teal);flex:none}
  .soc-handle{font-size:.6vw;color:#4a4c4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #foot{margin-top:auto;font-size:.66vw;color:#7a7c7a;line-height:1.45;text-align:center}
  #foot b{color:var(--ink)}
</style>
</head>

  var player, dead = 0, skips = 0;

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      playerVars: {
        listType:'playlist', list: cfg.list,
        autoplay:1, mute:1, controls:0, rel:0, fs:0, disablekb:1,
        modestbranding:1, playsinline:1, iv_load_policy:3
      },
      events: {
        onReady: function (e) {
          document.getElementById('msg').style.display='none';
          e.target.mute();
          if (shuffle) { try { e.target.setShuffle(true); } catch(_){} }
          try { e.target.setLoop(true); } catch(_){}
          e.target.playVideo();
        },
        onError: function (e) {
          dead++;
          if (dead > 25) { location.reload(); return; }
          try { e.target.nextVideo(); } catch(_) { location.reload(); }
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) {
            try { e.target.playVideoAt(0); } catch(_) { location.reload(); }
          }
          if (e.data === YT.PlayerState.PLAYING) {
            dead = 0;
            var dur = 0;
            try { dur = e.target.getDuration(); } catch(_) {}
            // Uploads feeds mix vertical Shorts in with real videos; they
            // pillarbox badly on a 16:9 TV. Skip them, but give up after a
            // dozen tries so an all-Shorts channel still shows something.
            if (minSecs > 0 && dur > 0 && dur <= minSecs && skips < 12) {
              skips++;
              try { e.target.nextVideo(); } catch(_) {}
              return;
            }
            skips = 0;
          }
        }
      }
    });
  };

  setTimeout(function () {
    try { if (!player || player.getPlayerState() !== YT.PlayerState.PLAYING) location.reload(); }
    catch(_) { location.reload(); }
  }, 60000);

  if (reloadMins > 0) setTimeout(function(){ location.reload(); }, reloadMins*60000);

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>

</html>
